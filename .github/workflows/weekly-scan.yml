name: weekly-scan

# 发现模式：每周一次抓取狩猎场、分析痛点，把快照提交回仓库。
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   LLM_API_KEY        必填（DeepSeek API Key）
#   LLM_BASE_URL       可选（默认 https://api.deepseek.com）
#   LLM_MODEL          可选（默认 deepseek-v4-flash）
#   REDDIT_CLIENT_ID   可选（配了才会抓 Reddit，否则只抓 HN）
#   REDDIT_CLIENT_SECRET 可选

on:
  schedule:
    - cron: "0 8 * * 1" # 每周一 08:00 UTC
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scan
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node scripts/scan.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scan): weekly snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
