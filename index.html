<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>需求雷达 / DemandRadar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{ --body:'Inter',system-ui,sans-serif; --display:'Space Grotesk','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
      --ink:#0F1620; --ink2:#0B1017; --panel:#15202C; --panel2:#1A2733; --line:#26384A; --lineSoft:#1F2E3D;
      --text:#E8EEF4; --muted:#90A1B2; --faint:#5C6E7F; --signal:#F4A52E; --strong:#46C08C; --pay:#E5604D; --alt:#7FB2E8; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; background:var(--ink); color:var(--text); font-family:var(--body); }
    .dr-btn{ cursor:pointer; transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease; }
    .dr-btn:active{ transform:translateY(1px); }
    .dr-go{ background:var(--signal); color:var(--ink); border:1px solid var(--signal); }
    .dr-go:hover{ background:#ffb648; }
    .dr-ex:hover{ border-color:var(--signal); color:var(--text); }
    .dr-tab{ background:transparent; color:var(--faint); border:none; border-bottom:2px solid transparent; }
    .dr-tab:hover{ color:var(--muted); }
    .dr-tab-on{ color:var(--text); border-bottom-color:var(--signal); }
    .dr-card{ animation:dr-rise .45s ease both; }
    .dr-link{ color:var(--alt); text-decoration:none; border-bottom:1px solid var(--lineSoft); }
    .dr-link:hover{ border-color:var(--alt); }
    input.dr-input::placeholder{ color:var(--faint); }
    input.dr-input:focus{ outline:none; border-color:var(--signal); }
    button:focus-visible, input:focus-visible{ outline:2px solid var(--signal); outline-offset:2px; }
    @keyframes dr-rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
    @keyframes dr-pulse{ 0%,100%{ transform:scaleY(.45); opacity:.5;} 50%{ transform:scaleY(1); opacity:1;} }
    .dr-bar-pulse{ transform-origin:bottom; animation:dr-pulse 1s ease-in-out infinite; }
    @keyframes dr-sweep{ 0%{ left:-30%; } 100%{ left:100%; } }
    .dr-sweep::after{ content:''; position:absolute; top:0; bottom:0; width:30%; left:-30%;
      background:linear-gradient(90deg,transparent,#F4A52E44,transparent); animation:dr-sweep 1.6s linear infinite; }
    @media (prefers-reduced-motion: reduce){ .dr-bar-pulse,.dr-sweep::after,.dr-card{ animation:none !important; } }
    .dr-chip-edit{ cursor:pointer; position:relative; }
    .dr-chip-edit:hover{ border-color:var(--signal) !important; }
    .dr-chip-x{ position:absolute; top:-6px; right:-6px; width:14px; height:14px; border-radius:50%; background:var(--pay); color:#fff; font-size:10px; line-height:14px; text-align:center; cursor:pointer; display:none; }
    .dr-chip-edit:hover .dr-chip-x{ display:block; }
    .dr-hist{ cursor:pointer; transition:border-color .15s ease, background .15s ease; }
    .dr-hist:hover{ border-color:var(--signal); background:var(--panel2); }
    .dr-hist-x{ opacity:0; transition:opacity .15s ease; }
    .dr-hist:hover .dr-hist-x{ opacity:1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/plain" id="appsrc">
    const { useState, useRef, useEffect, useCallback } = React;
    const C = { ink:"#0F1620", ink2:"#0B1017", panel:"#15202C", panel2:"#1A2733", line:"#26384A", lineSoft:"#1F2E3D",
      text:"#E8EEF4", muted:"#90A1B2", faint:"#5C6E7F", signal:"#F4A52E", strong:"#46C08C", pay:"#E5604D", alt:"#7FB2E8" };
    const SIGNAL_META = { keyword:{label:"关键词",color:C.muted}, complaint:{label:"抱怨",color:C.signal}, alternative:{label:"替代品",color:C.alt}, payment:{label:"付费",color:C.pay} };
    const STRENGTH_META = { weak:{label:"弱",bars:2,color:C.faint}, medium:{label:"中",bars:4,color:C.signal}, strong:{label:"强",bars:6,color:C.strong} };
    const TREND_META = { new:{label:"新",mark:"●",color:C.strong}, heating:{label:"变热",mark:"▲",color:C.pay}, cooling:{label:"变冷",mark:"▼",color:C.faint}, steady:{label:"平稳",mark:"—",color:C.muted} };
    const TREND_ORDER = { new:0, heating:1, steady:2, cooling:3 };
    const EXAMPLES = ["epub 转换工具","AI 配音","background removal","发票生成器","表格数据清洗"];
    const SCAN_STEPS = ["扩展英文搜索词…","联网抓取 Hacker News / Reddit…","清洗去噪、跨源去重…","按痛点聚类…","分类信号、计算需求分数…"];

    function SignalBars({count=0,color=C.faint,animate=false,total=6}){
      return <span style={{display:"inline-flex",alignItems:"flex-end",gap:2,height:16}}>
        {Array.from({length:total}).map((_,i)=>{ const lit=i<count; const h=5+i*1.8;
          return <span key={i} className={animate?"dr-bar-pulse":""} style={{width:3,height:h,borderRadius:1,background:lit?color:C.lineSoft,animationDelay:animate?`${i*0.12}s`:undefined}}/>; })}
      </span>;
    }
    function Chip({children,color=C.muted}){ return <span style={{fontFamily:"var(--mono)",fontSize:11.5,color,border:`1px solid ${C.line}`,background:C.ink2,borderRadius:4,padding:"3px 8px",whiteSpace:"nowrap"}}>{children}</span>; }
    function Eyebrow({children}){ return <div style={{fontFamily:"var(--mono)",fontSize:11,letterSpacing:"0.14em",textTransform:"uppercase",color:C.faint,marginBottom:12}}>{children}</div>; }

    // ── Markdown 导出 ────────────────────────────────────
    function generateMarkdown(data){
      const exp=data.expansion||{};
      const mix=data.signalMix||{};
      let md = `# 需求验证报告：${data.input||"未知方向"}\n\n`;
      md += `> 生成时间：${new Date().toLocaleString()}\n\n`;
      md += `## 概要\n\n`;
      md += `- **需求分数**：${data.demandScore ?? "–"} / 100\n`;
      md += `- **整体信号**：${(STRENGTH_META[data.overallStrength]||{}).label||data.overallStrength||"–"}\n`;
      md += `- **决策建议**：${data.decision||"MIXED"}\n`;
      md += `- **决策理由**：${data.decisionReason||"–"}\n`;
      md += `- **抓取讨论数**：${data.fetchedCount??"–"}\n\n`;

      md += `## 信号构成\n\n`;
      md += `| 类型 | 数量 |\n|---|---|\n`;
      Object.keys(SIGNAL_META).forEach(k=>{
        md += `| ${SIGNAL_META[k].label} | ${Number(mix[k])||0} |\n`;
      });
      md += `\n`;

      md += `## 痛点清单\n\n`;
      (data.painPoints||[]).forEach((p,i)=>{
        const sig=SIGNAL_META[p.signalType]||{label:"?"};
        const st=STRENGTH_META[p.strength]||{label:"?"};
        md += `### ${i+1}. ${p.title}\n\n`;
        if(p.scenario) md += `> ${p.scenario}\n\n`;
        md += `- 信号类型：${sig.label} | 强度：${st.label} | 频次：${p.frequency??"–"} | 跨平台：${p.platformCount??"–"} | ${p.isRealPain?"**真痛点**":"未验证"}\n\n`;
        if((p.evidence||[]).length){
          md += `| 来源 | 摘要 | 链接 |\n|---|---|---|\n`;
          p.evidence.forEach(ev=>{ md += `| ${ev.source||"–"} | ${ev.snippet||"–"} | ${ev.url?`[原帖](${ev.url})`:"–"} |\n`; });
          md += `\n`;
        }
      });

      md += `## 扩词结果\n\n`;
      if(exp.englishSearchQuery) md += `- **英文搜索主题**：${exp.englishSearchQuery}\n`;
      [["关键词","keywords"],["相邻问题","relatedTerms"],["同义/共现","derivativeTerms"],["平台语境","sourceHints"],["排除歧义","excludedTerms"]].forEach(([label,key])=>{
        if((exp[key]||[]).length) md += `- **${label}**：${exp[key].join("、")}\n`;
      });
      md += `\n`;

      if((data.nextSearches||[]).length){
        md += `## 建议下一步搜索\n\n`;
        data.nextSearches.forEach(s=>{ md += `- ${s}\n`; });
        md += `\n`;
      }

      // BRD 深度分析（如已生成）
      const brd=data.brd;
      if(brd && brd.decision){
        const dec=brd.decision||{};
        const persona=brd.persona||{};
        const market=brd.marketSize||{};
        const pricing=brd.pricing||{};
        const sugg=pricing.suggested||{};
        md += `## BRD 深度分析\n\n`;
        md += `**决策**：${dec.verdict||"MIXED"} · 置信度 ${dec.confidence??"–"}/100\n\n`;
        if((dec.risks||[]).length){ md += `**风险**\n`; dec.risks.forEach(s=>{ md += `- ${s}\n`; }); md += `\n`; }
        if((dec.opportunities||[]).length){ md += `**机会**\n`; dec.opportunities.forEach(s=>{ md += `- ${s}\n`; }); md += `\n`; }
        if((dec.nextSteps||[]).length){ md += `**下一步**\n`; dec.nextSteps.forEach(s=>{ md += `- ${s}\n`; }); md += `\n`; }

        if(persona.description){
          md += `### 用户画像\n\n${persona.description}\n\n`;
          md += `- 痛点强度：${(PAIN_LEVEL[persona.painLevel]||{}).label||persona.painLevel||"–"}\n`;
          md += `- 付费意愿：${(WTP[persona.willingnessToPay]||{}).label||persona.willingnessToPay||"–"}\n`;
          if((persona.alternativesTried||[]).length) md += `- 试过的替代品：${persona.alternativesTried.join("、")}\n`;
          md += `\n`;
          if((persona.quotes||[]).length){
            md += `| 来源 | 引述 | 原帖 |\n|---|---|---|\n`;
            persona.quotes.forEach(q=>{ md += `| ${q.source||"–"} | "${q.snippet||"–"}" | ${q.url?`[原帖](${q.url})`:"–"} |\n`; });
            md += `\n`;
          }
        }

        if((brd.competitors||[]).length){
          md += `### 主要竞品\n\n`;
          brd.competitors.forEach((c,i)=>{
            md += `**${i+1}. ${c.name}**${c.url?` · [官网](${c.url})`:""}\n\n`;
            if(c.positioning) md += `- 定位：${c.positioning}\n`;
            if(c.weakness) md += `- 弱点：${c.weakness}\n`;
            if((c.evidence||[]).length){
              md += `- 证据：\n`;
              c.evidence.forEach(ev=>{ md += `  - ${ev.source||"–"}: ${ev.snippet||"–"}${ev.url?` ([原帖](${ev.url}))`:""}\n`; });
            }
            md += `\n`;
          });
        }

        if(market.reasoning){
          md += `### 市场规模\n\n`;
          md += `- 信号：**${(MARKET[market.signal]||{}).label||market.signal||"–"}**（${market.signal||"–"}）\n`;
          md += `- 理由：${market.reasoning}\n`;
          if((market.indicators||[]).length){ md += `- 信号源：\n`; market.indicators.forEach(s=>{ md += `  - ${s}\n`; }); }
          md += `\n`;
        }

        if((pricing.benchmarks||[]).length || sugg.range){
          md += `### 定价\n\n`;
          if((pricing.benchmarks||[]).length){
            md += `**对标**\n\n| 竞品 | 套餐 | 价格 |\n|---|---|---|\n`;
            pricing.benchmarks.forEach(b=>{ md += `| ${b.competitor||"–"} | ${b.plan||"–"} | ${b.price||"–"} |\n`; });
            md += `\n`;
          }
          if(sugg.range){
            md += `**建议**\n\n- 模型：${sugg.model||"–"}\n- 区间：**${sugg.range}**\n`;
            if(sugg.reasoning) md += `- 理由：${sugg.reasoning}\n`;
            md += `\n`;
          }
        }

        if((brd.thread||[]).length){
          md += `### 追问记录\n\n`;
          brd.thread.forEach((t,i)=>{
            md += `**Q${i+1}.** ${t.q}\n\n`;
            md += `${t.a}\n\n`;
            md += `> 置信度：${t.confidence||"medium"}\n\n`;
            if((t.citations||[]).length){
              t.citations.forEach(c=>{ md += `- [${c.index}] ${c.source||"–"}: ${c.snippet||"–"}${c.url?` ([原帖](${c.url}))`:""}\n`; });
              md += `\n`;
            }
          });
        }
      }

      md += `---\n\n*证据来自真实抓取的公开讨论，片段为摘要转述，请点原帖核对。需求分数与 BRD 是辅助判断，不构成保证。*\n`;
      return md;
    }

    function downloadMarkdown(data){
      const md = generateMarkdown(data);
      const slug = (data.input||"report").replace(/[^a-zA-Z0-9一-鿿]/g,"_").slice(0,30);
      const blob = new Blob([md],{type:"text/markdown;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `DemandRadar_${slug}_${new Date().toISOString().slice(0,10)}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ── 可编辑扩词标签 ──────────────────────────────────
    function EditableChips({items, color, onChange}){
      const [adding,setAdding]=useState(false);
      const [newVal,setNewVal]=useState("");
      const inputRef=useRef(null);
      useEffect(()=>{ if(adding && inputRef.current) inputRef.current.focus(); },[adding]);

      function remove(idx){ onChange(items.filter((_,i)=>i!==idx)); }
      function add(){
        const v=newVal.trim();
        if(v && !items.includes(v)){ onChange([...items,v]); }
        setNewVal(""); setAdding(false);
      }

      return <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        {items.map((t,i)=>
          <span key={i} className="dr-chip-edit" style={{fontFamily:"var(--mono)",fontSize:11.5,color,border:`1px solid ${C.line}`,background:C.ink2,borderRadius:4,padding:"3px 8px",whiteSpace:"nowrap",position:"relative"}}>
            {t}
            <span className="dr-chip-x" onClick={()=>remove(i)}>x</span>
          </span>
        )}
        {adding
          ? <input ref={inputRef} value={newVal} onChange={e=>setNewVal(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") add(); if(e.key==="Escape"){setAdding(false);setNewVal("");} }}
              onBlur={add}
              style={{fontFamily:"var(--mono)",fontSize:11.5,color:C.text,background:C.ink2,border:`1px solid ${C.signal}`,borderRadius:4,padding:"3px 8px",width:120,outline:"none"}}
              placeholder="输入后回车"/>
          : <button onClick={()=>setAdding(true)}
              style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,background:"transparent",border:`1px dashed ${C.lineSoft}`,borderRadius:4,padding:"3px 8px",cursor:"pointer"}}>+ 添加</button>
        }
      </div>;
    }

    // ── BRD 深度分析卡 ──────────────────────────────────
    const PAIN_LEVEL = { low:{label:"低",color:C.faint}, medium:{label:"中",color:C.signal}, high:{label:"高",color:C.pay} };
    const WTP = { unknown:{label:"未知",color:C.faint}, low:{label:"低",color:C.faint}, medium:{label:"中",color:C.signal}, high:{label:"高",color:C.strong} };
    const MARKET = { tiny:{label:"小众",color:C.faint}, niche:{label:"细分",color:C.muted}, broad:{label:"广阔",color:C.signal}, massive:{label:"庞大",color:C.strong} };

    const ASK_SUGGESTIONS = [
      "如何验证用户付费意愿？",
      "MVP 应该砍掉哪些功能？",
      "竞品的弱点怎么具体复现？",
      "为什么定价是这个区间？",
    ];

    function BRDCard({brd, input, expansion, onUpdate}){
      const [askInput,setAskInput]=useState("");
      const [askStatus,setAskStatus]=useState("idle");
      const [askError,setAskError]=useState("");

      async function ask(q){
        const question=(q||"").trim();
        if(!question || !brd || !brd.decision || askStatus==="loading") return;
        setAskStatus("loading"); setAskError(""); setAskInput("");
        try{
          const res=await fetch("/api/brd-ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({input,expansion,brd,question})});
          const r=await res.json();
          if(r.error && !r.answer){ setAskError(r.error); setAskStatus("error"); return; }
          const entry={ q:question, a:r.answer, citations:r.citations||[], confidence:r.confidence||"medium", ts:Date.now() };
          if(onUpdate) onUpdate({...brd, thread:[...(brd.thread||[]), entry]});
          setAskStatus("done");
        }catch(e){ setAskError("网络错误："+e.message); setAskStatus("error"); }
      }

      if(!brd) return null;
      if(brd.error) return <div style={{marginTop:18,border:`1px solid ${C.pay}55`,background:"#2a1614",borderRadius:10,padding:"14px 16px",fontSize:13,color:C.text}}>BRD 解析失败：{brd.error}</div>;
      if(brd.thin) return <div style={{marginTop:18,border:`1px solid ${C.lineSoft}`,background:C.panel,borderRadius:10,padding:"14px 16px",fontFamily:"var(--mono)",fontSize:12.5,color:C.muted}}>{brd.reason||"语料不足，无法生成 BRD。"}</div>;

      const dec=brd.decision||{};
      const decColor=dec.verdict==="GO"?C.strong:dec.verdict==="NO-GO"?C.pay:C.signal;
      const persona=brd.persona||{};
      const market=brd.marketSize||{};
      const pricing=brd.pricing||{};
      const sugg=pricing.suggested||{};
      const conf=Math.max(0,Math.min(100,Number(dec.confidence)||0));
      const pl=PAIN_LEVEL[persona.painLevel]||PAIN_LEVEL.low;
      const wtp=WTP[persona.willingnessToPay]||WTP.unknown;
      const mk=MARKET[market.signal]||MARKET.tiny;

      const SectionHead=({children})=><div style={{fontFamily:"var(--mono)",fontSize:11,letterSpacing:"0.1em",textTransform:"uppercase",color:C.faint,marginBottom:10}}>{children}</div>;

      return <div className="dr-card" style={{marginTop:18,border:`1px solid ${C.line}`,background:C.panel,borderRadius:12,padding:"20px 22px"}}>
        {/* 决策标题条 */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,paddingBottom:14,borderBottom:`1px solid ${C.lineSoft}`}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontFamily:"var(--display)",fontWeight:700,fontSize:16,color:C.text}}>BRD 深度分析</span>
            <span style={{display:"inline-flex",alignItems:"center",gap:7,border:`1px solid ${decColor}`,color:decColor,borderRadius:6,padding:"4px 10px",fontFamily:"var(--display)",fontWeight:700,fontSize:13}}>{dec.verdict||"MIXED"}</span>
            <span style={{fontFamily:"var(--mono)",fontSize:11.5,color:C.muted}}>置信度 <span style={{color:decColor}}>{conf}</span><span style={{color:C.faint}}>/100</span></span>
          </div>
          {brd.deepenFetchedCount!=null && <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint}}>基于 {brd.deepenFetchedCount} 条聚焦语料</span>}
        </div>

        {/* 决策摘要：风险 / 机会 / 下一步 */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14,marginTop:16}}>
          {[["风险","risks",C.pay],["机会","opportunities",C.strong],["下一步","nextSteps",C.signal]].map(([label,key,col])=>{
            const arr=dec[key]||[];
            return <div key={key}>
              <div style={{fontFamily:"var(--mono)",fontSize:10.5,letterSpacing:"0.1em",textTransform:"uppercase",color:col,marginBottom:7}}>{label}</div>
              {arr.length===0 ? <div style={{fontFamily:"var(--mono)",fontSize:11.5,color:C.faint}}>–</div>
                : <ul style={{margin:0,paddingLeft:16,fontSize:13,color:C.muted,lineHeight:1.55}}>{arr.map((s,i)=><li key={i} style={{marginBottom:4}}>{s}</li>)}</ul>}
            </div>;
          })}
        </div>

        {/* 用户画像 */}
        {persona.description && <div style={{marginTop:22,paddingTop:18,borderTop:`1px solid ${C.lineSoft}`}}>
          <SectionHead>用户画像</SectionHead>
          <div style={{fontSize:14,color:C.text,lineHeight:1.55,marginBottom:10}}>{persona.description}</div>
          <div style={{display:"flex",gap:18,flexWrap:"wrap",fontFamily:"var(--mono)",fontSize:11.5,color:C.faint,marginBottom:12}}>
            <span>痛点强度 <span style={{color:pl.color}}>{pl.label}</span></span>
            <span>付费意愿 <span style={{color:wtp.color}}>{wtp.label}</span></span>
            {(persona.alternativesTried||[]).length>0 && <span>试过的替代品 <span style={{color:C.muted}}>{persona.alternativesTried.slice(0,4).join("、")}</span></span>}
          </div>
          {(persona.quotes||[]).length>0 && <div style={{display:"flex",flexDirection:"column",gap:7,paddingTop:8,borderTop:`1px dashed ${C.lineSoft}`}}>
            {persona.quotes.map((q,i)=><div key={i} style={{display:"flex",gap:10,alignItems:"baseline"}}>
              <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:90}}>{q.source||"来源"}</span>
              <span style={{fontSize:13,color:C.muted,lineHeight:1.5}}>"{q.snippet}" {q.url && <a className="dr-link" href={q.url} target="_blank" rel="noopener noreferrer">原帖 ↗</a>}</span>
            </div>)}
          </div>}

                </div>)}

        </div>}

        {/* 市场规模 + 定价 */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:18,marginTop:22,paddingTop:18,borderTop:`1px solid ${C.lineSoft}`}}>
          {market.reasoning && <div>
            <SectionHead>市场规模</SectionHead>

              <span style={{fontFamily:"var(--display)",fontWeight:700,fontSize:18,color:mk.color}}>{mk.label}</span>
              <span style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint}}>{market.signal}</span>
            </div>
            <div style={{fontSize:13,color:C.muted,lineHeight:1.55}}>{market.reasoning}</div>
            {(market.indicators||[]).length>0 && <ul style={{margin:"8px 0 0",paddingLeft:16,fontSize:12.5,color:C.faint,lineHeight:1.55}}>{market.indicators.map((s,i)=><li key={i}>{s}</li>)}</ul>}
          </div>}
          {(pricing.benchmarks||[]).length>0 || sugg.range ? <div>
            <SectionHead>定价</SectionHead>
            {(pricing.benchmarks||[]).length>0 && <div style={{marginBottom:10,fontFamily:"var(--mono)",fontSize:11.5}}>
              <div style={{color:C.faint,marginBottom:5}}>对标</div>
              {pricing.benchmarks.map((b,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,color:C.muted,padding:"3px 0"}}>
                <span>{b.competitor} <span style={{color:C.faint}}>· {b.plan}</span></span>
                <span style={{color:C.text}}>{b.price}</span>
              </div>)}
            </div>}
            {sugg.range && <div>
              <div style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,marginBottom:5}}>建议</div>
              <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:5}}>
                <span style={{fontFamily:"var(--display)",fontWeight:700,fontSize:16,color:sugg.range==="unknown"?C.faint:C.signal}}>{sugg.range}</span>
                {sugg.model && <span style={{fontFamily:"var(--mono)",fontSize:11,color:C.muted}}>{sugg.model}</span>}
              </div>
              {sugg.reasoning && <div style={{fontSize:12.5,color:C.muted,lineHeight:1.5}}>{sugg.reasoning}</div>}
            </div>}
          </div> : null}
        </div>

        {/* 追问 Q&A */}
        <div style={{marginTop:22,paddingTop:18,borderTop:`1px solid ${C.lineSoft}`}}>
          <SectionHead>追问 · 基于 BRD 与新抓取语料</SectionHead>

          {/* 历史 Q&A 线 */}
          {(brd.thread||[]).length>0 && <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:14}}>
            {brd.thread.map((t,i)=>{
              const cf=t.confidence==="high"?C.strong:t.confidence==="low"?C.pay:C.signal;
              return <div key={i} style={{border:`1px solid ${C.lineSoft}`,background:C.ink2,borderRadius:8,padding:"12px 14px"}}>
                <div style={{display:"flex",gap:10,alignItems:"baseline",marginBottom:8}}>
                  <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:18}}>Q</span>
                  <span style={{flex:1,fontSize:13.5,color:C.text,fontWeight:500}}>{t.q}</span>
                </div>
                <div style={{display:"flex",gap:10,alignItems:"baseline"}}>
                  <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:cf,minWidth:18}}>A</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13.5,color:C.muted,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{t.a}</div>
                    <div style={{marginTop:6,fontFamily:"var(--mono)",fontSize:10.5,color:C.faint}}>置信度 <span style={{color:cf}}>{t.confidence}</span></div>
                    {(t.citations||[]).length>0 && <div style={{marginTop:8,paddingTop:8,borderTop:`1px dashed ${C.lineSoft}`,display:"flex",flexDirection:"column",gap:5}}>
                      {t.citations.map((c,j)=><div key={j} style={{display:"flex",gap:8,alignItems:"baseline"}}>
                        <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:cf,minWidth:24}}>[{c.index}]</span>
                        <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:78}}>{c.source||"–"}</span>
                        <span style={{fontSize:12,color:C.muted,lineHeight:1.5,flex:1}}>{c.snippet} {c.url && <a className="dr-link" href={c.url} target="_blank" rel="noopener noreferrer">原帖 ↗</a>}</span>
                      </div>)}
                    </div>}
                  </div>
                </div>
              </div>;
            })}
          </div>}

          {/* 输入区 */}
          <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
            <textarea
              value={askInput}
              onChange={e=>setAskInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); ask(askInput); } }}
              placeholder="对 BRD 追问（Ctrl/⌘+Enter 发送）…"
              disabled={askStatus==="loading"}
              rows={2}
              style={{flex:"1 1 360px",background:C.ink2,color:C.text,border:`1px solid ${C.line}`,borderRadius:7,padding:"9px 12px",fontFamily:"var(--text)",fontSize:13.5,resize:"vertical",minHeight:38,outline:"none"}}
            />
            <button className="dr-btn" onClick={()=>ask(askInput)} disabled={askStatus==="loading"||!askInput.trim()}
              style={{background:C.signal,color:C.ink,border:`1px solid ${C.signal}`,borderRadius:7,padding:"9px 18px",fontFamily:"var(--display)",fontWeight:600,fontSize:13,opacity:(askStatus==="loading"||!askInput.trim())?0.5:1}}>
              {askStatus==="loading"?"追问中…":"发送"}
            </button>
          </div>

          {/* 快捷问题 */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
            {ASK_SUGGESTIONS.map(s=><button key={s} className="dr-btn" onClick={()=>ask(s)} disabled={askStatus==="loading"}
              style={{background:"transparent",color:C.muted,border:`1px solid ${C.lineSoft}`,borderRadius:14,padding:"4px 11px",fontFamily:"var(--mono)",fontSize:11,opacity:askStatus==="loading"?0.5:1}}>
              {s}
            </button>)}
          </div>

          {/* 状态 */}
          {askStatus==="loading" && <div style={{marginTop:12,display:"flex",alignItems:"center",gap:10}}>
            <SignalBars count={4} color={C.signal} animate total={4}/>
            <span style={{fontFamily:"var(--mono)",fontSize:11.5,color:C.muted}}>抓取相关讨论 + 生成回答…</span>
          </div>}
          {askStatus==="error" && <div style={{marginTop:12,fontSize:12.5,color:C.pay}}>{askError}</div>}
        </div>
      </div>;
    }

    function PainCard({p,i,showTrend}){
      const sig=SIGNAL_META[p.signalType]||SIGNAL_META.complaint;
      const st=STRENGTH_META[p.strength]||STRENGTH_META.weak;
      const tr=showTrend?(TREND_META[p.trend]||TREND_META.steady):null;
      return <div className="dr-card" style={{border:`1px solid ${C.line}`,background:C.panel,borderRadius:12,padding:"18px 18px 16px",animationDelay:`${i*0.06}s`}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:14,flexWrap:"wrap",alignItems:"flex-start"}}>
          <div style={{flex:"1 1 320px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              {tr && <span title={tr.label} style={{color:tr.color,fontSize:12}}>{tr.mark}</span>}
              <span style={{fontFamily:"var(--display)",fontWeight:600,fontSize:16.5,color:C.text}}>{p.title}</span>
              {tr && <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:tr.color,border:`1px solid ${tr.color}66`,borderRadius:4,padding:"2px 7px"}}>{tr.label}</span>}
              {p.isRealPain
                ? <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.strong,border:`1px solid ${C.strong}66`,borderRadius:4,padding:"2px 7px"}}>真痛点</span>
                : <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,border:`1px solid ${C.lineSoft}`,borderRadius:4,padding:"2px 7px"}}>未验证</span>}
            </div>
            {p.scenario && <div style={{fontSize:13.5,color:C.muted,marginTop:7,lineHeight:1.5}}>{p.scenario}</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
            <Chip color={sig.color}>{sig.label}信号</Chip>
            <div style={{display:"flex",alignItems:"center",gap:7}}><SignalBars count={st.bars} color={st.color} total={6}/><span style={{fontFamily:"var(--mono)",fontSize:11,color:st.color}}>{st.label}</span></div>
          </div>
        </div>
        <div style={{display:"flex",gap:18,marginTop:12,fontFamily:"var(--mono)",fontSize:11.5,color:C.faint}}>
          <span>频次 <span style={{color:C.muted}}>{p.frequency??"–"}</span></span>
          <span>跨平台 <span style={{color:C.muted}}>{p.platformCount??"–"}</span></span>
        </div>
        {(p.evidence||[]).length>0 && <div style={{marginTop:14,paddingTop:13,borderTop:`1px solid ${C.lineSoft}`,display:"flex",flexDirection:"column",gap:9}}>
          {p.evidence.map((ev,j)=><div key={j} style={{display:"flex",gap:10,alignItems:"baseline"}}>
            <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:96}}>{ev.source||"来源"}</span>
            <span style={{fontSize:13,color:C.muted,lineHeight:1.5}}>{ev.snippet} {ev.url && <a className="dr-link" href={ev.url} target="_blank" rel="noopener noreferrer">原帖 ↗</a>}</span>
          </div>)}
        </div>}
      </div>;
    }

    // ── 验证历史（localStorage 本地保存）──────────────────
    const HISTORY_KEY="dr_history_v1";
    const HISTORY_CAP=20;
    function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]"); }catch(e){ return []; } }
    function saveToHistory(input,result){
      try{
        const list=loadHistory();
        const entry={ id:`${Date.now()}_${Math.random().toString(36).slice(2,7)}`, input, ts:Date.now(),
          score:result.demandScore??null, decision:result.decision||"MIXED", strength:result.overallStrength||"weak", result };
        const next=[entry,...list].slice(0,HISTORY_CAP);
        localStorage.setItem(HISTORY_KEY,JSON.stringify(next));
        return next;
      }catch(e){ return loadHistory(); }
    }
    function removeHistory(id){
      const next=loadHistory().filter(h=>h.id!==id);
      try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(next)); }catch(e){}
      return next;
    }
    function clearAllHistory(){ try{ localStorage.removeItem(HISTORY_KEY); }catch(e){} return []; }
    function relTime(ts){
      const s=Math.floor((Date.now()-ts)/1000);
      if(s<60) return "刚刚";
      if(s<3600) return `${Math.floor(s/60)} 分钟前`;
      if(s<86400) return `${Math.floor(s/3600)} 小时前`;
      return `${Math.floor(s/86400)} 天前`;
    }

    // ── 验证模式 ──────────────────────────────────────────
    function Validate(){
      const [input,setInput]=useState("");
      const [status,setStatus]=useState("idle");
      const [result,setResult]=useState(null);
      const [error,setError]=useState("");
      const [stepIdx,setStepIdx]=useState(0);
      const [history,setHistory]=useState([]);
      const timerRef=useRef(null);
      useEffect(()=>()=>clearInterval(timerRef.current),[]);
      useEffect(()=>{ setHistory(loadHistory()); },[]);

      async function runScan(q, customExpansion){
        const query=(q??input).trim();
        if(!query||status==="scanning") return;
        setStatus("scanning"); setError(""); setResult(null); setStepIdx(0);
        timerRef.current=setInterval(()=>setStepIdx(i=>(i+1)%SCAN_STEPS.length),2600);
        try{
          let expansion = customExpansion;
          if(!expansion){
            const expRes=await fetch("/api/expand",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({input:query})});
            const expData=await expRes.json();
            if(expData.error){ clearInterval(timerRef.current); setError(expData.error); setStatus("error"); return; }
            expansion=expData.expansion;
          }
          const res=await fetch("/api/analyze",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({input:query,expansion})});
          const data=await res.json();
          clearInterval(timerRef.current);
          if(data.error){ setError(data.error==="parse_failed"?"结果解析失败，可能被截断。请重试或把方向写得更聚焦。":data.error); setStatus("error"); return; }
          if(!data.painPoints){ setError("返回数据异常，请重试。"); setStatus("error"); return; }
          setResult(data); setStatus("done");
          setHistory(saveToHistory(query, data));
        }catch(e){ clearInterval(timerRef.current); setError("网络错误："+e.message); setStatus("error"); }
      }

      function handleRescan(editedExpansion){
        runScan(input, editedExpansion);
      }

      function loadFromHistory(entry){
        clearInterval(timerRef.current);
        setInput(entry.input); setResult(entry.result); setStatus("done"); setError("");
        window.scrollTo({top:0,behavior:"smooth"});
      }
      function deleteHistory(e,id){ e.stopPropagation(); setHistory(removeHistory(id)); }
      function clearHistory(){ setHistory(clearAllHistory()); }

      // 当 BRD 生成后，把它合并进当前 result 和最近一条历史记录
      function handleDeepen(brd){
        setResult(prev => prev ? { ...prev, brd } : prev);
        try{
          const list=loadHistory();
          if(list.length>0){ list[0]={...list[0], result:{...list[0].result, brd}}; localStorage.setItem(HISTORY_KEY,JSON.stringify(list)); setHistory(list); }
        }catch(e){}
      }

      return <div>
        <Eyebrow>调谐 · 输入方向（中 / 英均可）</Eyebrow>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input className="dr-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")runScan();}}
            placeholder="例如：epub 转换工具 / AI 配音 / background removal"
            style={{flex:"1 1 360px",background:C.ink2,border:`1px solid ${C.line}`,borderRadius:8,color:C.text,fontFamily:"var(--body)",fontSize:15,padding:"13px 14px"}}/>
          <button className="dr-btn dr-go" onClick={()=>runScan()} disabled={status==="scanning"} style={{borderRadius:8,fontFamily:"var(--display)",fontWeight:600,fontSize:15,padding:"0 22px",opacity:status==="scanning"?0.6:1}}>{status==="scanning"?"扫描中…":"开始扫描"}</button>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
          {EXAMPLES.map(ex=><button key={ex} className="dr-ex dr-btn" onClick={()=>{setInput(ex);runScan(ex);}} style={{fontFamily:"var(--mono)",fontSize:12,color:C.muted,background:"transparent",border:`1px solid ${C.lineSoft}`,borderRadius:20,padding:"5px 12px"}}>{ex}</button>)}
        </div>

        {history.length>0 && status!=="scanning" && <div style={{marginTop:22}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"var(--mono)",fontSize:10.5,letterSpacing:"0.12em",textTransform:"uppercase",color:C.faint}}>最近验证 · 本地保存（{history.length}）</span>
            <button className="dr-btn" onClick={clearHistory} style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,background:"transparent",border:`1px solid ${C.lineSoft}`,borderRadius:6,padding:"3px 10px"}}>清空</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {history.map(h=>{
              const dc=h.decision==="GO"?C.strong:h.decision==="NO-GO"?C.pay:C.signal;
              return <div key={h.id} className="dr-hist" onClick={()=>loadFromHistory(h)}
                style={{display:"flex",alignItems:"center",gap:12,border:`1px solid ${C.lineSoft}`,background:C.panel,borderRadius:8,padding:"9px 12px"}}>
                <span style={{flex:"1 1 auto",fontSize:13.5,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.input}</span>
                <span style={{fontFamily:"var(--mono)",fontSize:12,color:C.muted,minWidth:52,textAlign:"right"}}>{h.score??"–"}<span style={{color:C.faint,fontSize:10}}>/100</span></span>
                <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:dc,border:`1px solid ${dc}66`,borderRadius:4,padding:"2px 7px",minWidth:54,textAlign:"center"}}>{h.decision}</span>
                <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:62,textAlign:"right"}}>{relTime(h.ts)}</span>
                <span className="dr-hist-x" onClick={e=>deleteHistory(e,h.id)} style={{color:C.faint,fontSize:15,cursor:"pointer",padding:"0 2px",lineHeight:1}} title="删除">×</span>
              </div>;
            })}
          </div>
        </div>}

        {status==="scanning" && <div style={{marginTop:34}}>
          <div className="dr-sweep" style={{position:"relative",overflow:"hidden",height:3,background:C.lineSoft,borderRadius:2}}/>
          <div style={{display:"flex",alignItems:"center",gap:14,marginTop:22}}><SignalBars count={6} color={C.signal} animate total={6}/><span style={{fontFamily:"var(--mono)",fontSize:13.5,color:C.muted}}>{SCAN_STEPS[stepIdx]}</span></div>
          <div style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,marginTop:12}}>扩词 + 抓取 + 分析，通常 10–20 秒，请稍候。</div>
        </div>}

        {status==="error" && <div style={{marginTop:30,border:`1px solid ${C.pay}55`,background:"#2a1614",borderRadius:10,padding:"16px 18px"}}>
          <div style={{fontFamily:"var(--mono)",fontSize:12,color:C.pay,letterSpacing:"0.08em",marginBottom:6}}>扫描未完成</div>
          <div style={{fontSize:14,color:C.text,lineHeight:1.5}}>{error}</div>
          <button className="dr-btn" onClick={()=>runScan()} style={{marginTop:14,background:C.panel,color:C.text,border:`1px solid ${C.line}`,borderRadius:7,padding:"8px 16px",fontFamily:"var(--display)",fontWeight:600,fontSize:13}}>重试</button>
        </div>}

        {status==="done" && result && <Report data={result} onRescan={handleRescan} onDeepen={handleDeepen}/>}
      </div>;
    }

    function Report({data, onRescan, onDeepen}){
      const strength=STRENGTH_META[data.overallStrength]||STRENGTH_META.weak;
      const score=Math.max(0,Math.min(100,Number(data.demandScore)||0));
      const decisionColor=data.decision==="GO"?C.strong:data.decision==="NO-GO"?C.pay:C.signal;
      const mix=data.signalMix||{};
      const mixTotal=Object.values(mix).reduce((a,b)=>a+(Number(b)||0),0)||1;
      const origExp=data.expansion||{};

      const [editExp,setEditExp]=useState(null);
      const isEditing = editExp !== null;
      const exp = isEditing ? editExp : origExp;

      const [brd,setBrd]=useState(data.brd||null);
      const [brdStatus,setBrdStatus]=useState(data.brd?"done":"idle");
      const [brdError,setBrdError]=useState("");
      useEffect(()=>{ setBrd(data.brd||null); setBrdStatus(data.brd?"done":"idle"); setBrdError(""); },[data]);

      function startEdit(){ setEditExp(JSON.parse(JSON.stringify(origExp))); }
      function cancelEdit(){ setEditExp(null); }
      function updateField(field, newArr){ setEditExp(prev=>({...prev,[field]:newArr})); }
      function doRescan(){ if(onRescan && editExp){ onRescan(editExp); setEditExp(null); } }

      async function runDeepen(){
        if(brdStatus==="loading") return;
        setBrdStatus("loading"); setBrdError(""); setBrd(null);
        try{
          const res=await fetch("/api/deepen",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({input:data.input,expansion:origExp})});
          const r=await res.json();
          if(r.error && !r.decision){ setBrdError(r.error); setBrdStatus("error"); return; }
          setBrd(r); setBrdStatus("done");
          if(onDeepen) onDeepen(r);
        }catch(e){ setBrdError("网络错误："+e.message); setBrdStatus("error"); }
      }

      return <div style={{marginTop:34}}>
        {/* 操作栏 */}
        <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
          <button className="dr-btn" onClick={()=>downloadMarkdown({...data,brd})}
            style={{background:C.panel,color:C.text,border:`1px solid ${C.line}`,borderRadius:7,padding:"8px 16px",fontFamily:"var(--display)",fontWeight:600,fontSize:13}}>
            导出 Markdown
          </button>
          {!brd && brdStatus!=="loading" && <button className="dr-btn" onClick={runDeepen}
            style={{background:C.signal,color:C.ink,border:`1px solid ${C.signal}`,borderRadius:7,padding:"8px 16px",fontFamily:"var(--display)",fontWeight:600,fontSize:13}}>
            深入分析（BRD）
          </button>}
          {brd && brdStatus==="done" && <button className="dr-btn" onClick={runDeepen}
            style={{background:"transparent",color:C.muted,border:`1px solid ${C.line}`,borderRadius:7,padding:"8px 16px",fontFamily:"var(--mono)",fontSize:12}}>
            重新生成 BRD
          </button>}
        </div>

        <div className="dr-card" style={{border:`1px solid ${C.line}`,background:C.panel,borderRadius:12,padding:"22px 22px 20px"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:20,flexWrap:"wrap",alignItems:"flex-start"}}>
            <div>
              <Eyebrow>需求分数</Eyebrow>
              <div style={{display:"flex",alignItems:"baseline",gap:8}}><span style={{fontFamily:"var(--display)",fontWeight:700,fontSize:54,lineHeight:1,color:strength.color}}>{score}</span><span style={{fontFamily:"var(--mono)",fontSize:14,color:C.faint}}>/100</span></div>
              <div style={{marginTop:12,width:220,maxWidth:"60vw",height:5,background:C.lineSoft,borderRadius:3,overflow:"hidden"}}><div style={{width:`${score}%`,height:"100%",background:strength.color}}/></div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:12}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint}}>整体信号</span><SignalBars count={strength.bars} color={strength.color} total={6}/><span style={{fontFamily:"var(--display)",fontWeight:600,fontSize:14,color:strength.color}}>{strength.label}</span></div>
              <div style={{display:"inline-flex",alignItems:"center",gap:8,border:`1px solid ${decisionColor}`,color:decisionColor,borderRadius:6,padding:"6px 12px",fontFamily:"var(--display)",fontWeight:700,fontSize:14}}>{data.decision||"MIXED"}</div>
            </div>
          </div>
          {data.decisionReason && <div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${C.lineSoft}`,fontSize:14,color:C.muted,lineHeight:1.55}}>{data.decisionReason}</div>}
          {data.fetchedCount!=null && <div style={{marginTop:10,fontFamily:"var(--mono)",fontSize:10.5,color:C.faint}}>基于 {data.fetchedCount} 条真实抓取的讨论{data.llmUsage ? ` · LLM ${data.llmUsage.calls} 次调用` : ""}</div>}
        </div>

        {/* BRD 深度分析 */}
        {brdStatus==="loading" && <div style={{marginTop:18,border:`1px solid ${C.lineSoft}`,background:C.panel,borderRadius:10,padding:"14px 18px"}}>
          <div className="dr-sweep" style={{position:"relative",overflow:"hidden",height:2,background:C.lineSoft,borderRadius:1,marginBottom:14}}/>
          <div style={{display:"flex",alignItems:"center",gap:12}}><SignalBars count={6} color={C.signal} animate total={6}/><span style={{fontFamily:"var(--mono)",fontSize:13,color:C.muted}}>抓取竞品 / 定价 / 评测 + 生成 BRD…</span></div>
          <div style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,marginTop:10}}>通常 15–30 秒</div>
        </div>}
        {brdStatus==="error" && <div style={{marginTop:18,border:`1px solid ${C.pay}55`,background:"#2a1614",borderRadius:10,padding:"14px 18px"}}>
          <div style={{fontFamily:"var(--mono)",fontSize:12,color:C.pay,marginBottom:5}}>BRD 生成失败</div>
          <div style={{fontSize:13.5,color:C.text}}>{brdError}</div>
          <button className="dr-btn" onClick={runDeepen} style={{marginTop:10,background:C.panel,color:C.text,border:`1px solid ${C.line}`,borderRadius:6,padding:"6px 14px",fontFamily:"var(--mono)",fontSize:12}}>重试</button>
        </div>}
        {brd && brdStatus==="done" && <BRDCard brd={brd} input={data.input} expansion={origExp} onUpdate={(updated)=>{ setBrd(updated); if(onDeepen) onDeepen(updated); }}/>}

        <div style={{marginTop:22}}>
          <Eyebrow>信号构成</Eyebrow>
          <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",border:`1px solid ${C.lineSoft}`}}>
            {Object.keys(SIGNAL_META).map(k=>{ const v=Number(mix[k])||0; const pct=(v/mixTotal)*100; if(pct<=0)return null; return <div key={k} style={{width:`${pct}%`,background:SIGNAL_META[k].color}} title={`${SIGNAL_META[k].label}: ${v}`}/>; })}
          </div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:10}}>
            {Object.keys(SIGNAL_META).map(k=><span key={k} style={{display:"inline-flex",alignItems:"center",gap:6,fontFamily:"var(--mono)",fontSize:11.5,color:C.muted}}><span style={{width:9,height:9,borderRadius:2,background:SIGNAL_META[k].color}}/>{SIGNAL_META[k].label} <span style={{color:C.faint}}>{Number(mix[k])||0}</span></span>)}
          </div>
        </div>

        <div style={{marginTop:30}}>
          <Eyebrow>痛点清单 · 含证据</Eyebrow>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>{(data.painPoints||[]).map((p,i)=><PainCard key={i} p={p} i={i} showTrend={false}/>)}</div>
        </div>

        {/* 扩词区域（可编辑） */}
        <div style={{marginTop:30}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <Eyebrow style={{}}>扩词 · 英文搜索表达{isEditing?" （编辑中）":""}</Eyebrow>
            <div style={{display:"flex",gap:8}}>
              {isEditing
                ? <>
                    <button className="dr-btn" onClick={doRescan} style={{background:C.signal,color:C.ink,border:`1px solid ${C.signal}`,borderRadius:6,padding:"5px 14px",fontFamily:"var(--display)",fontWeight:600,fontSize:12}}>用修改后的词重新扫描</button>
                    <button className="dr-btn" onClick={cancelEdit} style={{background:"transparent",color:C.muted,border:`1px solid ${C.line}`,borderRadius:6,padding:"5px 14px",fontFamily:"var(--mono)",fontSize:12}}>取消</button>
                  </>
                : <button className="dr-btn" onClick={startEdit} style={{background:"transparent",color:C.muted,border:`1px solid ${C.line}`,borderRadius:6,padding:"5px 14px",fontFamily:"var(--mono)",fontSize:12}}>编辑扩词</button>
              }
            </div>
          </div>
          {exp.englishSearchQuery && <div style={{fontFamily:"var(--mono)",fontSize:13,color:C.text,marginBottom:12}}>"{exp.englishSearchQuery}"</div>}
          {[["关键词","keywords",C.muted],["相邻问题","relatedTerms",C.alt],["同义/共现","derivativeTerms",C.signal],["平台语境","sourceHints",C.faint],["排除歧义","excludedTerms",C.pay]].map(([label,field,col])=>{
            const arr = exp[field]||[];
            if(!isEditing && !arr.length) return null;
            return <div key={label} style={{display:"flex",gap:8,alignItems:"baseline",marginBottom:9,flexWrap:"wrap"}}>
              <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,minWidth:64}}>{label}</span>
              {isEditing
                ? <EditableChips items={arr} color={col} onChange={newArr=>updateField(field,newArr)}/>
                : <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{arr.map((t,i)=><Chip key={i} color={col}>{t}</Chip>)}</div>
              }
            </div>;
          })}
        </div>

        {(data.nextSearches||[]).length>0 && <div style={{marginTop:30}}>
          <Eyebrow>建议的下一步搜索</Eyebrow>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{data.nextSearches.map((s,i)=><div key={i} style={{display:"flex",gap:10,alignItems:"baseline",fontSize:13.5,color:C.muted}}><span style={{color:C.signal,fontFamily:"var(--mono)"}}>→</span><span style={{fontFamily:"var(--mono)",fontSize:12.5}}>{s}</span></div>)}</div>
        </div>}

        <div style={{marginTop:34,paddingTop:16,borderTop:`1px solid ${C.lineSoft}`,fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,lineHeight:1.6}}>证据来自真实抓取的公开讨论，片段为摘要转述，请点「原帖」核对原文。需求分数是辅助判断，不构成保证 — 最终决策仍需你自己拍板。</div>
      </div>;
    }

    // ── 发现模式 ──────────────────────────────────────────
    function Discover(){
      const [snap,setSnap]=useState(undefined);
      const [snapList,setSnapList]=useState([]);
      const [selectedDate,setSelectedDate]=useState("latest");

      useEffect(()=>{
        fetch("./data/latest.json",{cache:"no-store"})
          .then(r=>r.ok?r.json():null)
          .then(d=>{ if(!d||d.placeholder||!d.generatedAt) setSnap(null); else setSnap(d); })
          .catch(()=>setSnap(null));
        fetch("/api/snapshots")
          .then(r=>r.ok?r.json():null)
          .then(d=>{ if(d && d.snapshots) setSnapList(d.snapshots); })
          .catch(()=>{});
      },[]);

      function loadSnapshot(date){
        setSelectedDate(date);
        if(date==="latest"){
          fetch("./data/latest.json",{cache:"no-store"})
            .then(r=>r.ok?r.json():null)
            .then(d=>setSnap(d||null))
            .catch(()=>setSnap(null));
        } else {
          fetch(`./data/snapshots/${date}.json`,{cache:"no-store"})
            .then(r=>r.ok?r.json():null)
            .then(d=>setSnap(d||null))
            .catch(()=>setSnap(null));
        }
      }

      if(snap===undefined) return <div style={{marginTop:30,fontFamily:"var(--mono)",fontSize:13,color:C.muted}}>读取最新快照…</div>;

      if(snap===null) return <div style={{marginTop:30,border:`1px solid ${C.line}`,background:C.panel,borderRadius:12,padding:"22px"}}>
        <Eyebrow>还没有快照</Eyebrow>
        <div style={{fontSize:14,color:C.muted,lineHeight:1.65}}>
          发现模式由每周一次的定时任务生成。第一次需要手动触发一下：<br/>
          · GitHub 仓库 → <span style={{color:C.text}}>Actions</span> → <span style={{color:C.text}}>weekly-scan</span> → <span style={{color:C.text}}>Run workflow</span>；<br/>
          · 或本地执行 <span style={{fontFamily:"var(--mono)",color:C.signal}}>npm run scan</span>（需先配置 LLM_API_KEY）。<br/>
          跑完会把快照提交进仓库的 <span style={{fontFamily:"var(--mono)"}}>data/</span> 目录，这里就会显示「本周新痛点 / 正在变热」。
        </div>
      </div>;

      const pains=[...(snap.painPoints||[])].sort((a,b)=>{
        const t=(TREND_ORDER[a.trend]??9)-(TREND_ORDER[b.trend]??9); if(t) return t;
        const s=(STRENGTH_META[b.strength]?.bars||0)-(STRENGTH_META[a.strength]?.bars||0); if(s) return s;
        return (b.frequency||0)-(a.frequency||0);
      });
      const dateStr=new Date(snap.generatedAt).toLocaleString();

      return <div style={{marginTop:30}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:16}}>
          <Eyebrow>{selectedDate==="latest"?"最新":"历史"} · {snap.theme}</Eyebrow>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {snapList.length>0 && <select value={selectedDate} onChange={e=>loadSnapshot(e.target.value)}
              style={{fontFamily:"var(--mono)",fontSize:12,color:C.text,background:C.ink2,border:`1px solid ${C.line}`,borderRadius:6,padding:"6px 10px",cursor:"pointer"}}>
              <option value="latest">最新快照</option>
              {snapList.map(s=><option key={s.date} value={s.date}>{s.date} ({s.painCount} 个痛点)</option>)}
            </select>}
            <span style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint}}>{dateStr} · {snap.fetchedCount??"–"} 条讨论</span>
          </div>
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:18}}>
          {Object.keys(TREND_META).map(k=><span key={k} style={{display:"inline-flex",alignItems:"center",gap:6,fontFamily:"var(--mono)",fontSize:11,color:C.faint}}><span style={{color:TREND_META[k].color}}>{TREND_META[k].mark}</span>{TREND_META[k].label}</span>)}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>{pains.map((p,i)=><PainCard key={i} p={p} i={i} showTrend={true}/>)}</div>
        {(snap.nextSearches||[]).length>0 && <div style={{marginTop:28}}>
          <Eyebrow>建议深挖</Eyebrow>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{snap.nextSearches.map((s,i)=><div key={i} style={{display:"flex",gap:10,alignItems:"baseline",fontSize:13.5,color:C.muted}}><span style={{color:C.signal,fontFamily:"var(--mono)"}}>→</span><span style={{fontFamily:"var(--mono)",fontSize:12.5}}>{s}</span></div>)}</div>
        </div>}
        <div style={{marginTop:30,paddingTop:16,borderTop:`1px solid ${C.lineSoft}`,fontFamily:"var(--mono)",fontSize:10.5,color:C.faint,lineHeight:1.6}}>趋势按与上次快照对比得出。要换监控范围，改仓库里的 config/huntingground.json。</div>
      </div>;
    }

    function App(){
      const [tab,setTab]=useState("validate");
      return <div style={{minHeight:"100vh"}}>
        <div style={{maxWidth:860,margin:"0 auto",padding:"40px 22px 64px"}}>
          <header style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <SignalBars count={6} color={C.signal} total={6}/>
              <div>
                <div style={{fontFamily:"var(--display)",fontWeight:700,fontSize:22,letterSpacing:"-0.01em"}}>需求雷达 <span style={{color:C.signal}}>/</span> DemandRadar</div>
                <div style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,marginTop:2,letterSpacing:"0.04em"}}>V0.5 · 找信号，不找灵感</div>
              </div>
            </div>
            <div style={{fontFamily:"var(--mono)",fontSize:11,color:C.faint,maxWidth:240,textAlign:"right"}}>抓真实讨论，输出带证据的需求判断</div>
          </header>

          <div style={{display:"flex",gap:24,marginTop:24,borderBottom:`1px solid ${C.lineSoft}`}}>
            <button className={"dr-btn dr-tab "+(tab==="validate"?"dr-tab-on":"")} onClick={()=>setTab("validate")} style={{fontFamily:"var(--display)",fontWeight:600,fontSize:14,padding:"0 0 10px"}}>验证 · 主动查一个方向</button>
            <button className={"dr-btn dr-tab "+(tab==="discover"?"dr-tab-on":"")} onClick={()=>setTab("discover")} style={{fontFamily:"var(--display)",fontWeight:600,fontSize:14,padding:"0 0 10px"}}>发现 · 本周新痛点</button>
          </div>

          {tab==="validate" ? <div style={{marginTop:28}}><Validate/></div> : <Discover/>}
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>
    (function () {
      try {
        var src = document.getElementById("appsrc").textContent;
        var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        (0, eval)(out);
      } catch (e) {
        console.error(e);
        document.getElementById("root").innerHTML =
          '<pre style="color:#E5604D;font-family:monospace;padding:28px;white-space:pre-wrap;font-size:13px;">页面脚本出错：' +
          ((e && e.message) ? e.message : e) + '</pre>';
      }
    })();
  </script>
</body>
</html>
